name: SMS opt-in branch verification

on:
  push:
    branches:
      - fix/sms-optin-optional-consent

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL: "1"
      NEXT_PUBLIC_SUPABASE_URL: "https://audit-only.supabase.co"
      NEXT_PUBLIC_SUPABASE_ANON_KEY: "audit-only-key"
      NEXT_PUBLIC_KKUT_HUG_PAYMENT_URL: "https://buy.stripe.com/fZu8wOawC4wicy8fbU4ow0y"
      NEXT_PUBLIC_KKUT_REVIEWED_HUG_PAYMENT_URL: "https://buy.stripe.com/fZu8wOawC4wicy8fbU4ow0y"
    steps:
      - name: Check out controlled branch
        uses: actions/checkout@v4

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Audit optional checkbox source
        run: |
          node <<'NODE'
          const fs = require('fs');
          const assert = require('assert/strict');
          const page = fs.readFileSync('app/sms-optin/page.tsx', 'utf8');
          const checkbox = page.match(/<input\s+[^>]*id="sms-consent"[^>]*\/>/)?.[0] || '';
          assert.match(checkbox, /type="checkbox"/);
          assert.doesNotMatch(checkbox, /\brequired\b/);
          assert.match(page, /unchecked by default/i);
          assert.match(page, /submit this form without agreeing to SMS/i);
          assert.match(page, /Consent is not a condition of purchase/i);
          console.log('OPTIONAL CHECKBOX SOURCE AUDIT: PASS');
          NODE

      - name: Build controlled preview
        run: npm run build

      - name: Verify unchecked and checked POST paths
        run: |
          npm run start > /tmp/k-kut-sms-verify.log 2>&1 &
          APP_PID=$!
          trap 'kill $APP_PID 2>/dev/null || true' EXIT

          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/sms-optin >/dev/null; then
              break
            fi
            sleep 2
          done

          UNCHECKED=$(curl -fsS \
            -H 'Content-Type: application/json' \
            -d '{"phone":"309-555-0100","smsConsent":false}' \
            http://127.0.0.1:3000/api/sms-optin)

          CHECKED=$(curl -fsS \
            -H 'Content-Type: application/json' \
            -d '{"phone":"309-555-0100","smsConsent":true}' \
            http://127.0.0.1:3000/api/sms-optin)

          echo "$UNCHECKED" | grep '"status":"SMS_NOT_ENABLED"'
          echo "$CHECKED" | grep '"status":"SMS_CONSENT_RECEIVED"'

          INVALID_STATUS=$(curl -sS -o /tmp/invalid.json -w '%{http_code}' \
            -H 'Content-Type: application/json' \
            -d '{"phone":"123","smsConsent":false}' \
            http://127.0.0.1:3000/api/sms-optin)

          test "$INVALID_STATUS" = "400"

          echo 'UNCHECKED PATH: PASS — HTTP 200 / SMS_NOT_ENABLED'
          echo 'CHECKED PATH: PASS — HTTP 200 / SMS_CONSENT_RECEIVED'
          echo 'INVALID PHONE PATH: PASS — HTTP 400'

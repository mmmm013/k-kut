name: Build Thank You medium Audio Logo canary

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/thank-you-medium75-canary.yml

permissions:
  contents: write

concurrency:
  group: thank-you-medium75-canary
  cancel-in-progress: false

jobs:
  build-canary:
    if: github.head_ref == 'canary/thank-you-ch1-medium75' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out full governed history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: canary/thank-you-ch1-medium75

      - name: Reconstruct source and render 75% Audio Logo
        shell: bash
        run: |
          set -euo pipefail

          test "$GITHUB_HEAD_REF" = "canary/thank-you-ch1-medium75"
          command -v ffmpeg >/dev/null
          command -v ffprobe >/dev/null

          mkdir -p /tmp/thank-you-medium75
          mkdir -p public/kkr/ii-canary/thank-you

          git show 870521bcfd9e8770c486a4d4f6d2c804dcbcb613:staging/mothers-day/thank-you/source/thank-you-pix-source.mp3 > /tmp/thank-you-medium75/parent.mp3
          git show 906e9532b5824e8e208002125603053f459e750b:public/mothers-day/thank-you/kks-expanded/thank-you-sec-ch1.mp3 > /tmp/thank-you-medium75/ch1.mp3

          PARENT_SHA="$(sha256sum /tmp/thank-you-medium75/parent.mp3 | awk '{print $1}')"
          test "$PARENT_SHA" = "ab2cf02369f75c8f5d64b9f8f24203e0ac6196fcf3c64f39da3ddf7c4b83c5bd"

          LOGO="public/signature/sti/gpm-sti-twinkle-v001-stop-at-audio-end.mp3"
          test -f "$LOGO"
          LOGO_SHA="$(sha256sum "$LOGO" | awk '{print $1}')"
          test "$LOGO_SHA" = "26221e344fed1fb7abe579c24cff276cfd86f271f940dfde93d3ed507419f19f"

          RAW_SHA="$(sha256sum /tmp/thank-you-medium75/ch1.mp3 | awk '{print $1}')"
          test "$RAW_SHA" != "b5c089fafaeaf75019db38a99a164e6074d335cf5a7907c0662e6dc8d5958fb2"
          test "$RAW_SHA" != "dc05fc30d88b3cb56db31550aa7f701a8aa8f5b139e941d76b78e62bc884b84d"

          OUT="public/kkr/ii-canary/thank-you/thank-you-sec-ch1-ii-pad135s-audio-logo-medium75.mp3"
          ffmpeg -hide_banner -loglevel error -y \
            -f lavfi -t 1.35 -i anullsrc=channel_layout=stereo:sample_rate=44100 \
            -i /tmp/thank-you-medium75/ch1.mp3 \
            -f lavfi -t 0.75 -i anullsrc=channel_layout=stereo:sample_rate=44100 \
            -i "$LOGO" \
            -filter_complex "[0:a]aresample=44100,aformat=sample_fmts=fltp:channel_layouts=stereo[front];[1:a]aresample=44100,aformat=sample_fmts=fltp:channel_layouts=stereo[music];[2:a]aresample=44100,aformat=sample_fmts=fltp:channel_layouts=stereo[gap];[3:a]aresample=44100,aformat=sample_fmts=fltp:channel_layouts=stereo,volume=0.75[logo];[front][music][gap][logo]concat=n=4:v=0:a=1,afade=t=in:st=0:d=0.08[a]" \
            -map "[a]" -codec:a libmp3lame -b:a 192k "$OUT"

          test -s "$OUT"
          OUTPUT_SHA="$(sha256sum "$OUT" | awk '{print $1}')"
          OUTPUT_DURATION="$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$OUT")"

          RAW_SHA="$RAW_SHA" OUTPUT_SHA="$OUTPUT_SHA" OUTPUT_DURATION="$OUTPUT_DURATION" node --input-type=module <<'NODE'
          import fs from "node:fs";

          const branch = "canary/thank-you-ch1-medium75";
          const audioUrl = "/kkr/ii-canary/thank-you/thank-you-sec-ch1-ii-pad135s-audio-logo-medium75.mp3";
          const rawSha = process.env.RAW_SHA;
          const outputSha = process.env.OUTPUT_SHA;
          const outputDuration = Number(process.env.OUTPUT_DURATION);

          const policyPath = "data/audio-law/twinkle-volume-policy.json";
          const policy = JSON.parse(fs.readFileSync(policyPath, "utf8"));
          policy.status = "locked_rule";
          policy.rule_name = "Twinkle Medium Audio Logo Policy";
          policy.default_delivery_gain = 0.75;
          policy.default_delivery_gain_label = "75% · MEDIUM";
          policy.core_law = [
            "Twinkle is the closing Audio Logo layer for every II.",
            "MEDIUM is the default Audio Logo column.",
            "Default MEDIUM Audio Logo gain is 0.75.",
            "Original Audio Logo source remains unchanged.",
            "Delivery copies must materialize the Audio Logo at 75%."
          ];
          policy.publication_rule = "Every newly materialized II uses the 75% MEDIUM Audio Logo unless the owner explicitly approves another governed column.";
          fs.writeFileSync(policyPath, JSON.stringify(policy, null, 2) + "\n");

          const route = `import { NextResponse } from "next/server";

          export const runtime = "nodejs";
          export const dynamic = "force-dynamic";

          const HOLD_STATUS = "STRICT_MUSIC_EMERGENCY_HOLD";
          const CANARY_BRANCH = "${branch}";
          const isThankYouCanary =
            process.env.VERCEL_ENV === "preview" &&
            process.env.VERCEL_GIT_COMMIT_REF === CANARY_BRANCH;

          export async function GET() {
            if (isThankYouCanary) {
              return NextResponse.json(
                {
                  ok: true,
                  status: "THANK_YOU_CH1_PREVIEW_CANARY",
                  inventoryCount: 1,
                  purchasableCount: 0,
                  records: [
                    {
                      id: "thank-you-sec-ch1",
                      label: "Thank You · Chorus 1",
                      family: "KK",
                      lane: "Gratitude",
                      offer: "KK HUG",
                      priceUsd: 9.99,
                      audioUrl: "${audioUrl}",
                      checkout: "kk",
                      checkoutHref: "",
                      personalNoteWordLimit: 13,
                    },
                  ],
                  canary: {
                    scope: "preview_playback_only",
                    audioLogoColumn: "MEDIUM",
                    audioLogoGain: 0.75,
                    checkoutEnabled: false,
                    productionEligible: false,
                    productionBlocker: "numeric_LT_PIX_parent_ID_pending",
                  },
                },
                {
                  status: 200,
                  headers: {
                    "Cache-Control": "no-store, max-age=0",
                    "X-KKUT-Canary": "thank-you-sec-ch1-medium75",
                    "X-KKUT-Inventory-Count": "1",
                    "X-KKUT-Purchasable-Count": "0",
                  },
                },
              );
            }

            return NextResponse.json(
              {
                ok: false,
                status: HOLD_STATUS,
                error: "strict_music_proof_required",
                message:
                  "Public playback and purchase are disabled until every II has explicit authorized-music proof and all MC-BOT/no-music records are isolated.",
                inventoryCount: 0,
                purchasableCount: 0,
                records: [],
                absoluteRequirements: {
                  every_II_contains_authorized_music: true,
                  known_MC_BOT_or_no_music_rows_allowed: 0,
                  unproven_music_rows_allowed: 0,
                  strict_music_proof_required_per_row: true,
                  customer_audio_canary_required: true,
                },
              },
              {
                status: 503,
                headers: {
                  "Cache-Control": "no-store, max-age=0",
                  "X-KKUT-Strict-Music-Hold": "active",
                  "X-KKUT-Inventory-Count": "0",
                  "X-KKUT-Purchasable-Count": "0",
                },
              },
            );
          }
          `;
          fs.writeFileSync("app/api/public-ii-catalog/route.ts", route);

          const browse = `import Link from "next/link";
          import PublicIiBrowser from "@/components/PublicIiBrowser";

          export const metadata = {
            title: "K-KUT Controlled Audio | G Putnam Music",
            description: "Controlled K-KUT playback and strict music safety status.",
          };

          export const dynamic = "force-dynamic";

          const CANARY_BRANCH = "${branch}";

          export default function BrowsePage() {
            const canary =
              process.env.VERCEL_ENV === "preview" &&
              process.env.VERCEL_GIT_COMMIT_REF === CANARY_BRANCH;

            return (
              <main className="min-h-screen bg-[#09070b] text-white">
                <section className="mx-auto flex max-w-5xl flex-col gap-8 px-5 py-10 sm:px-8">
                  <header className={\`rounded-[2rem] border p-7 shadow-2xl md:p-10 \${
                    canary
                      ? "border-amber-300/50 bg-gradient-to-br from-[#3A2411] via-[#1A1008] to-[#050302]"
                      : "border-red-400/40 bg-gradient-to-br from-[#2A1710] via-[#140C08] to-[#050302]"
                  }\`}>
                    <p className="text-xs font-black uppercase tracking-[0.42em] text-[#FFD54F]">
                      G Putnam Music · K-KUT
                    </p>

                    <h1 className="mt-4 text-4xl font-black tracking-tight md:text-6xl">
                      {canary ? "Thank You audio canary" : "Strict music emergency hold"}
                    </h1>

                    <p className="mt-5 max-w-4xl text-lg font-bold leading-8 text-[#EFEBE9]">
                      {canary
                        ? "Preview only: listen to one governed Thank You Chorus 1 II with the 75% MEDIUM Audio Logo. Sending and checkout remain closed."
                        : "Public audio and checkout are closed. Every II must have an LT-PIX SSOT parent and explicit proof that the source and customer file contain authorized music. MC-BOT scripts and all no-music audio are prohibited."}
                    </p>

                    <div className="mt-7 grid gap-3 sm:grid-cols-3">
                      <span className="rounded-2xl border border-[#FFD54F]/40 bg-black/25 px-4 py-3 text-sm font-black text-[#FFF3C4]">
                        {canary ? "Preview audio: 1" : "Public audio: 0"}
                      </span>
                      <span className="rounded-2xl border border-red-400/40 bg-red-950/30 px-4 py-3 text-sm font-black text-red-100">
                        Purchasable IIs: 0
                      </span>
                      <span className="rounded-2xl border border-red-400/40 bg-red-950/30 px-4 py-3 text-sm font-black text-red-100">
                        MC-BOT allowed: 0
                      </span>
                    </div>

                    <Link href="/" className="mt-7 inline-block rounded-2xl border border-[#FFD54F]/65 px-5 py-3 text-sm font-black text-[#FFD54F]">
                      Back home
                    </Link>
                  </header>

                  <PublicIiBrowser />

                  <footer className="rounded-[1.75rem] border border-[#8D6E63]/35 bg-black/20 p-5 text-sm font-bold leading-7 text-[#BCAAA4]">
                    {canary
                      ? "Canary boundary: Preview playback only. Production, sending, and checkout remain blocked until the numeric LT-PIX parent ID and final listening approval are recorded."
                      : "Reopening requires per-II LT-PIX SSOT, strict authorized-music proof, MC-BOT/no-music isolation, identity proof, Audio-Logo-at-end proof, and customer playback validation."}
                  </footer>
                </section>
              </main>
            );
          }
          `;
          fs.writeFileSync("app/browse/page.tsx", browse);

          const packet = {
            schema_version: "KKUT_THANK_YOU_CH1_CANARY_V001",
            status: "PREVIEW_CANARY_LISTENING_REQUIRED",
            owner_approvals: [
              "APPROVE CANARY: Thank You — USE GITHUB",
              "MEDIUM = 75%"
            ],
            inventory_id: "thank-you-sec-ch1",
            public_label: "Thank You · Chorus 1",
            lt_pix_ssot_parent_id: null,
            lt_pix_ssot_parent_title: "Thank You",
            lt_pix_ssot_parent_status: "LEGACY_SSOT_HASH_VERIFIED_NUMERIC_ID_PENDING",
            lt_pix_parent_audio_sha256: "ab2cf02369f75c8f5d64b9f8f24203e0ac6196fcf3c64f39da3ddf7c4b83c5bd",
            raw_customer_excerpt_sha256: rawSha,
            customer_audio_url: audioUrl,
            customer_audio_sha256: outputSha,
            customer_audio_duration_seconds: outputDuration,
            authorized_music_source_status: "OWNER_APPROVED_PREVIEW_CANARY_FROM_HASH_VERIFIED_THANK_YOU_PARENT",
            strict_music_gate_status: "PREVIEW_PASS_PARENT_HASH_AND_MC_BOT_SHA_BLOCK_NUMERIC_LT_PIX_ID_PENDING",
            known_mc_bot_no_music_sha256_blocklist: [
              "b5c089fafaeaf75019db38a99a164e6074d335cf5a7907c0662e6dc8d5958fb2",
              "dc05fc30d88b3cb56db31550aa7f701a8aa8f5b139e941d76b78e62bc884b84d"
            ],
            known_mc_bot_no_music_sha_match: false,
            human_customer_audio_qa: "CANARY_LISTENING_REQUIRED",
            audio_logo: {
              role: "closing_audio_logo",
              column: "MEDIUM",
              gain: 0.75,
              source_sha256: "26221e344fed1fb7abe579c24cff276cfd86f271f940dfde93d3ed507419f19f",
              at_end: true
            },
            rights_status: "OWNER_APPROVED_PREVIEW_CANARY_PRODUCTION_PACKET_PENDING",
            identity_status: "HASH_LOCKED",
            release_scope: "PREVIEW_PLAYBACK_ONLY",
            production_eligible: false,
            checkout_enabled: false,
            pricing: { HUG_KK_USD: 9.99 },
            blockers_before_production: [
              "numeric_LT_PIX_parent_ID",
              "human_listening_approval_of_75_percent_render"
            ]
          };
          fs.mkdirSync("data/kkr/canary", { recursive: true });
          fs.writeFileSync("data/kkr/canary/thank-you-ch1-medium75-release-packet.json", JSON.stringify(packet, null, 2) + "\n");

          const audit = `import crypto from "node:crypto";
          import fs from "node:fs";

          const stop = (message) => { throw new Error(message); };
          const sha256 = (path) => crypto.createHash("sha256").update(fs.readFileSync(path)).digest("hex");

          const policy = JSON.parse(fs.readFileSync("data/audio-law/twinkle-volume-policy.json", "utf8"));
          const packet = JSON.parse(fs.readFileSync("data/kkr/canary/thank-you-ch1-medium75-release-packet.json", "utf8"));
          const route = fs.readFileSync("app/api/public-ii-catalog/route.ts", "utf8");
          const audioPath = "public" + packet.customer_audio_url;

          if (policy.default_delivery_gain !== 0.75) stop("MEDIUM Audio Logo gain must equal 0.75");
          if (policy.default_delivery_gain_label !== "75% · MEDIUM") stop("MEDIUM Audio Logo label missing");
          if (packet.release_scope !== "PREVIEW_PLAYBACK_ONLY") stop("canary scope escaped Preview");
          if (packet.production_eligible !== false) stop("canary became production eligible");
          if (packet.checkout_enabled !== false) stop("canary checkout opened");
          if (packet.pricing?.HUG_KK_USD !== 9.99) stop("HUG price must equal $9.99");
          if (packet.lt_pix_ssot_parent_id !== null) stop("unproven LT-PIX ID was invented");
          if (packet.human_customer_audio_qa !== "CANARY_LISTENING_REQUIRED") stop("human listening gate weakened");
          if (!fs.existsSync(audioPath)) stop("canary audio missing");
          if (sha256(audioPath) !== packet.customer_audio_sha256) stop("canary audio SHA mismatch");
          if (!route.includes('process.env.VERCEL_ENV === "preview"')) stop("Preview environment gate missing");
          if (!route.includes('process.env.VERCEL_GIT_COMMIT_REF === CANARY_BRANCH')) stop("exact branch gate missing");
          if (!route.includes('checkoutHref: ""')) stop("checkout must remain disabled");
          if (!route.includes("priceUsd: 9.99")) stop("buyer-visible HUG price must equal $9.99");
          if (!route.includes("inventoryCount: 0") || !route.includes("purchasableCount: 0") || !route.includes("records: []")) stop("Production hold literals missing");

          console.log("THANK YOU MEDIUM75 PREVIEW CANARY AUDIT PASS");
          console.log("PREVIEW AUDIO: 1");
          console.log("PURCHASABLE IIS: 0");
          console.log("PRODUCTION ELIGIBLE: NO");
          `;
          fs.writeFileSync("scripts/audit-thank-you-medium75-canary.mjs", audit);

          const packagePath = "package.json";
          const pkg = JSON.parse(fs.readFileSync(packagePath, "utf8"));
          const canaryAudit = "node scripts/audit-thank-you-medium75-canary.mjs";
          if (!pkg.scripts.prebuild.includes(canaryAudit)) {
            pkg.scripts.prebuild = `${canaryAudit} && ${pkg.scripts.prebuild}`;
          }
          fs.writeFileSync(packagePath, JSON.stringify(pkg, null, 2) + "\n");
          NODE

      - name: Build before commit
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build

      - name: Commit only the validated canary
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/thank-you-medium75-canary.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            app/api/public-ii-catalog/route.ts \
            app/browse/page.tsx \
            data/audio-law/twinkle-volume-policy.json \
            data/kkr/canary/thank-you-ch1-medium75-release-packet.json \
            package.json \
            public/kkr/ii-canary/thank-you/thank-you-sec-ch1-ii-pad135s-audio-logo-medium75.mp3 \
            scripts/audit-thank-you-medium75-canary.mjs
          git commit -m "Build Preview-only Thank You Chorus 1 medium Audio Logo canary"
          git push origin HEAD:canary/thank-you-ch1-medium75
